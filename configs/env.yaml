# Task / environment. Loaded into quad_residual.sim_lite.env.EnvCfg by
# quad_residual.config -- unknown keys are an error, not silently ignored.
num_envs: 4096            # Isaac Lab; sim_lite takes ppo.sim_lite.num_envs instead
policy_mode: residual     # direct | residual | baseline
decimation: 5             # 250 Hz physics -> 50 Hz policy
episode_seconds: 10.0
trajectory: lemniscate    # hover | lemniscate | waypoints
residual_scale: 0.25      # policy may move each rotor command by +/- 25%

baseline:                 # the classical controller: compared against, and the residual's base
  baseline_gains: robust  # robust | fast -- see BASELINE_PRESETS and scripts/select_baseline_gains.py
  baseline_integral: true # PID position loop; false = the original PD loop
  baseline_info: nominal  # nominal: nominal params + the same noisy state the policy sees
                          # privileged: true randomized params + true state (old behaviour; ablation only)

reward:
  w_pos: 1.0              # exp(-2 * ||e_pos||)
  w_vel: 0.05
  w_rate: 0.02
  w_action: 0.01
  w_smooth: 0.03          # penalises action delta -> control smoothness
  w_alive: 0.5

termination:
  max_pos_err: 4.0        # m
  max_tilt: 1.3           # rad
